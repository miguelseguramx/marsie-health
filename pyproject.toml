[project]
name = "marsie-health"
version = "0.1.0"
description = "Marsie Health — Django backend service"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Miguel Segura", email = "miguelseguramx@gmail.com" }]
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "fhir.resources>=8.0,<9",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "moto[s3]>=5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marsie_health*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "marsie_health.settings"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
addopts = "-ra"
